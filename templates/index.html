<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HKD → USD</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>HKD to USD</h1>
    <p>Convert Hong Kong dollars to US dollars.</p>
    <form id="form">
      <label for="hkd">Amount in HKD</label>
      <input
        id="hkd"
        name="hkd"
        type="text"
        inputmode="decimal"
        autocomplete="off"
        spellcheck="false"
        value="100"
        required
      >
      <button type="submit">Convert</button>
    </form>
    <div class="result" id="result">
      <div><strong id="usd">{{ "%.2f"|format(100 * rate) }}</strong> USD</div>
      <div class="meta">1 HKD = {{ "%.4f"|format(rate) }} USD · {{ source }}</div>
    </div>
  </main>
  <script>
    const form = document.getElementById("form");
    const result = document.getElementById("result");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const hkd = document.getElementById("hkd").value;
      const response = await fetch("/convert", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ hkd }),
      });
      const data = await response.json();
      if (!response.ok) {
        result.innerHTML = `<div class="error">${data.error}</div>`;
        return;
      }
      result.innerHTML = `
        <div><strong>${data.usd.toFixed(2)}</strong> USD</div>
        <div class="meta">1 HKD = ${data.rate.toFixed(4)} USD · ${data.source}</div>
      `;
    });
  </script>
</body>
</html>
